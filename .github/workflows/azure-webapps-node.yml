# Build and deploy Next.js (standalone) to Azure App Service on every push to main.
#
# App Service "front" MUST have:
#   Startup Command: node server.js
#   Stack: Node 20 or 22
#   SCM Basic Auth Publishing Credentials: On
#   App setting: SCM_DO_BUILD_DURING_DEPLOYMENT = false
#   App setting: ENABLE_ORYX_BUILD = false
#
# API Cors__AllowedOrigins__0 =
#   https://front-c0dge8gudpg3d5g8.canadaeast-01.azurewebsites.net

name: Build and deploy Next.js to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: front
  NODE_VERSION: "22.x"
  API_PROXY_TARGET: https://inside-back-eee5hreqbjbvefcr.canadaeast-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          API_PROXY_TARGET: ${{ secrets.API_PROXY_TARGET || env.API_PROXY_TARGET }}
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Prepare standalone package
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/deploy"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Copy standalone output (includes hidden .next)
          shopt -s dotglob
          cp -a .next/standalone/. "$OUT/"

          if [ -f "$OUT/server.js" ]; then
            APP_DIR="$OUT"
          else
            APP_DIR="$(dirname "$(find "$OUT" -name server.js -type f | head -n 1)")"
          fi
          echo "Standalone app dir: $APP_DIR"
          test -f "$APP_DIR/server.js"
          test -d "$APP_DIR/.next"

          # static assets must sit next to the standalone .next
          mkdir -p "$APP_DIR/.next"
          rm -rf "$APP_DIR/.next/static"
          cp -a .next/static "$APP_DIR/.next/static"

          if [ -d public ]; then
            rm -rf "$APP_DIR/public"
            cp -a public "$APP_DIR/public"
          fi

          # Wrap Next server: force bind 0.0.0.0 for Azure
          mv "$APP_DIR/server.js" "$APP_DIR/next-server.js"
          printf '%s\n' \
            'process.env.HOSTNAME = "0.0.0.0";' \
            'process.env.PORT = process.env.PORT || "8080";' \
            'console.log("[azure] Next listening on", process.env.HOSTNAME + ":" + process.env.PORT);' \
            'require("./next-server.js");' \
            > "$APP_DIR/server.js"

          export APP_DIR
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const appDir = process.env.APP_DIR;
          const pkgPath = path.join(appDir, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.scripts = pkg.scripts || {};
          pkg.scripts.start = 'node server.js';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          console.log('patched', pkgPath, '->', pkg.scripts.start);
          NODE

          if [ "$APP_DIR" != "$OUT" ]; then
            echo "Flattening nested standalone into package root..."
            TMP="$GITHUB_WORKSPACE/deploy-flat"
            rm -rf "$TMP"
            mkdir -p "$TMP"
            cp -a "$APP_DIR"/. "$TMP"/
            rm -rf "$OUT"
            mv "$TMP" "$OUT"
          fi

          # Stop Oryx from rebuilding / extracting wrong node_modules
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' > "$OUT/.deployment"
          rm -f "$OUT/oryx-manifest.toml" "$OUT/node_modules.tar.gz" || true

          test -f "$OUT/server.js"
          test -f "$OUT/next-server.js"
          test -f "$OUT/.next/BUILD_ID"
          test -d "$OUT/.next/static"
          test -d "$OUT/.next/server"

          echo "BUILD_ID=$(cat "$OUT/.next/BUILD_ID")"
          echo "--- package root ---"
          ls -la "$OUT" | head -40
          echo "--- .next ---"
          ls -la "$OUT/.next" | head -40

      - name: Zip package (keeps .next hidden folder)
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/deploy"
          ZIP="$GITHUB_WORKSPACE/webapp.zip"
          rm -f "$ZIP"
          # Archive from inside folder so zip root = wwwroot.
          # Do NOT use zip -t (date filter). -y stores symlinks as links.
          (cd "$OUT" && zip -ry "$ZIP" .)
          echo "zip bytes: $(wc -c < "$ZIP")"
          # Avoid grep|head under pipefail (SIGPIPE / broken pipe → exit 2)
          if ! unzip -l "$ZIP" | grep -q '\.next/BUILD_ID'; then
            echo "ERROR: .next/BUILD_ID missing from zip"
            exit 1
          fi
          if ! unzip -l "$ZIP" | grep -q '\.next/static/'; then
            echo "ERROR: .next/static missing from zip"
            exit 1
          fi
          echo "Zip OK: .next/BUILD_ID and .next/static present"
          unzip -l "$ZIP" | grep '\.next/BUILD_ID' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: webapp.zip
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: .

      - name: Verify zip contains .next
        run: |
          set -euo pipefail
          test -f webapp.zip
          unzip -l webapp.zip | grep -q '\.next/BUILD_ID'
          echo "Artifact OK: .next/BUILD_ID present"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: webapp.zip
          clean: true
